spring:
  main:
    banner-mode: off
    log-startup-info: false
  profiles:
    active: test
  messages:
    basename: classpath:i18n/messages
    encoding: UTF-8
    cache-duration: 60
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  liquibase:
    enabled: false
  datasource:
    url: jdbc:tc:postgresql://localhost:5432/test
    username:
    password:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  cloud:
    aws:
      s3:
        endpoint:
        region: test
        bucket: test-bucket
      credentials:
        access-key: none
        secret-key: none
      region:
        static: test

client:
  api:
    batch-worker:
      host: http://localhost
      port: 8085
      context-path: batch-worker
      uri-path:
        execute-job: api/v1/batches

logging:
  level:
    root: ERROR