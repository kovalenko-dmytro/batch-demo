spring:
  application:
    name: batch-manager
  profiles:
    active: ${APPLICATION_PROFILE}
  messages:
    basename: classpath:i18n/messages
    encoding: UTF-8
    cache-duration: 60
  servlet:
    multipart:
      max-file-size: ${IMPORT_FILE_MAX_SIZE}
      max-request-size: ${IMPORT_FILE_MAX_SIZE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  liquibase:
    enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_EXTERNAL_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  cloud:
    aws:
      s3:
        endpoint: ${AWS_S3_ENDPOINT}:${AWS_S3_EXTERNAL_PORT}
        region: ${AWS_S3_REGION}
        bucket: ${AWS_S3_BUCKET_NAME}
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
      region:
        static: ${AWS_S3_REGION}

springdoc:
  api-docs:
    path: /api-docs

client:
  api:
    batch-worker:
      host: ${BATCH_WORKER_HOST}
      port: ${BATCH_WORKER_PORT}
      context-path: ${BATCH_WORKER_CONTEXT_PATH}
      uri-path:
        execute-job: ${BATCH_WORKER_EXECUTE_JOB_URI_PATH}

server:
  servlet:
    context-path: /${BATCH_MANAGER_CONTEXT_PATH}
  port: ${BATCH_MANAGER_PORT}

logging:
  level:
    org:
      springframework:
        data: WARN
        batch: WARN
      hibernate: WARN
    com:
      zaxxer:
        hikari: WARN